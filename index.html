<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>파일 다운로드</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#f4f7fb;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto}.head,.item{background:#fff;border:1px solid #e1e7f0;border-radius:14px;padding:15px;margin-bottom:10px}.head h1{margin:0 0 7px;font-size:1.4rem}.muted{color:#64748b;font-size:.92rem}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tools input{flex:1;min-width:170px;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.btn{display:inline-block;border:0;border-radius:10px;padding:11px 14px;background:#2563eb;color:white;text-decoration:none;font:inherit;font-weight:650;cursor:pointer}.item{display:flex;align-items:center;gap:12px}.fname{font-weight:650;overflow-wrap:anywhere;flex:1}.fileicon{font-size:1.4rem}.allnote{background:#eaf2ff;border-radius:10px;padding:12px;color:#244675;font-size:.9rem}@media(max-width:520px){body{padding:10px}.item{padding:12px}.btn{padding:10px 12px}}
</style></head><body><main class="wrap"><section class="head"><h1>파일 다운로드</h1><div class="muted" id="count"></div><div class="tools"><input id="search" placeholder="파일 이름 검색"><button class="btn" id="all">전체 다운로드</button></div><div class="allnote">전체 다운로드는 ZIP 압축 없이 각 파일을 차례로 열도록 시도합니다. 브라우저가 여러 다운로드를 막으면 허용해 주세요. 일부 Google Drive 파일은 미리보기 화면이 열릴 수 있습니다.</div></section><section id="list"></section></main>
<script>
const files=[{"name":"가장 빛난 별","url":"https://drive.google.com/file/d/1s4f-1eqZtbEOOSAKKOFr9SbITPGnmbY0/view?usp=drive_link"},{"name":"감사함으로","url":"https://drive.google.com/file/d/1wVm930DcgX5gtC2Bk3vTe5hnOIetBtqx/view?usp=drive_link"},{"name":"그 사랑얼마나","url":"https://drive.google.com/file/d/1KP5gg7dm-lsBcxHNOKrD2bYtcgZMBUfh/view?usp=drive_link"},{"name":"그 사랑이","url":"https://drive.google.com/file/d/1xNeJKnuMXy1PDy9yV2g0aLABhb5C_C2r/view?usp=drive_link"},{"name":"그 은혜로만","url":"https://drive.google.com/file/d/1l49D1ipuhIhoSoDKcIjGkxhoGjv5brCJ/view?usp=sharing"},{"name":"그 피가","url":"https://drive.google.com/file/d/1X2eQ4-ay8j_KJIMYtWzjXerex1mJlrYV/view?usp=drive_link"},{"name":"그 날에 우리 알게되리","url":"https://drive.google.com/file/d/1CqpQ1KHQklOa6Rz-r5viPrAcMxY1Qdwz/view?usp=drive_link"},{"name":"그리스도의 계절","url":"https://drive.google.com/file/d/1BxIZEw_QA6YKUAch2DZXH3ngy1-s6qYC/view?usp=drive_link"},{"name":"나의 모습 나의 소유","url":"https://drive.google.com/file/d/1YKKQTYiLrc048nRssW4m8WKDu66WqE_-/view?usp=drive_link"},{"name":"눈물로 말할 수 있죠","url":"https://drive.google.com/file/d/1pcrxkJOH0pcoxUdHmgQmPLcKDUwcsiy1/view?usp=drive_link"},{"name":"땅끝까지","url":"https://drive.google.com/file/d/1gnOaPd0FQYu3rV4uLRhtvSd_KdZStvKv/view?usp=drive_link"},{"name":"마라나타","url":"https://drive.google.com/file/d/1XMwJOQF5m1b5kfbLjzZFqjnnhmJKyz3_/view?usp=drive_link"},{"name":"미라클 제너레이션","url":"https://drive.google.com/file/d/1-FxlvEZNzONPFM4orfJrZ7sbft8fBrfj/view?usp=drive_link"},{"name":"사모곡","url":"https://drive.google.com/file/d/1c236-dhGjfaqVJDv_goVOabeSWFTYO7H/view?usp=drive_link"},{"name":"세상이 당신을 모른다 하여도","url":"https://drive.google.com/file/d/1YYzGUs7THn6lkS3VQiubEzVjdcnhnNNJ/view?usp=drive_link"},{"name":"신묘막측","url":"https://drive.google.com/file/d/1Mj43Jgy5obAp_TbZdApW0ig2G2r-2G5d/view?usp=drive_link"},{"name":"십자가(갈보리)","url":"https://drive.google.com/file/d/1bpI_IMZXafLhMFRc03uWcXkCAyuWjR3H/view?usp=drive_link"},{"name":"십자가의 길","url":"https://drive.google.com/file/d/1s7IY674OCXiP93JSQVRbKFWVaqNIdnva/view?usp=drive_link"},{"name":"아버지 품 안에서 난","url":"https://drive.google.com/file/d/1evxF85eKogv5D5fz9oFFAu2aJegbhj-B/view?usp=drive_link"},{"name":"옷자락에서 전해지는 사랑","url":"https://drive.google.com/file/d/1dwkhSO6y3-pMV391Zi6okmYXymyhmJ1J/view?usp=drive_link"},{"name":"우리가 하나된 이유","url":"https://drive.google.com/file/d/1GpB99zP3FhdREwntxj3GNL4g55UMSVRN/view?usp=drive_link"},{"name":"전능하신 나의 아버지","url":"https://drive.google.com/file/d/1XHabdxabycyCRWd7_HzElbx8mItmBzD3/view?usp=drive_link"},{"name":"찬양하는 가정","url":"https://drive.google.com/file/d/1MN8ythyy1ARF1v4ByeEbz9AoG36ckIqe/view?usp=drive_link"},{"name":"청년의 기도","url":"https://drive.google.com/file/d/1xjZYlGcfsKlKVZTHFqJbTxnqwhg9VTHo/view?usp=drive_link"},{"name":"하늘의 사랑","url":"https://drive.google.com/file/d/1zfkVUVbx-oDF5P8lc3RsEPIrNUQhzpeY/view?usp=drive_link"},{"name":"항해자","url":"https://drive.google.com/file/d/1sAGfaRnjADadGc2zXXPG-gPLFZZR35MR/view?usp=drive_link"},{"name":"히즈윌 사랑","url":"https://drive.google.com/file/d/1YTIX6yJp4e8W0v0G_JQw8u1FafJMwyKo/view?usp=drive_link"},{"name":"히즈윌 그대를 사랑하기를","url":"https://drive.google.com/file/d/1F6bSy8THnSL9V2z5NUAN6jeB3wOAReOF/view?usp=drive_link"},{"name":"히즈윌 나는 예수의 심장을 가졌는가","url":"https://drive.google.com/file/d/1rlYaiffDwQKW8tpOxdx26BnSNC22OCYo/view?usp=drive_link"},{"name":"you are special","url":"https://drive.google.com/file/d/1q3Dvc-Kdi4-zUFWUepyHbWxgOOie4h2f/view?usp=drive_link"}];
function id(url){try{const u=new URL(url);const parts=u.pathname.split('/');const ix=parts.indexOf('d');if(parts.includes('file')&&ix>=0)return parts[ix+1];return u.searchParams.get('id')}catch(e){return null}}
function downloadUrl(f){const fid=id(f.url);return fid?'https://drive.google.com/uc?export=download&id='+encodeURIComponent(fid):f.url}
function render(){const q=document.getElementById('search').value.toLowerCase();const found=files.filter(f=>f.name.toLowerCase().includes(q));document.getElementById('count').textContent=found.length+'개 파일';document.getElementById('list').innerHTML='';found.forEach(f=>{const row=document.createElement('div');row.className='item';const icon=document.createElement('span');icon.className='fileicon';icon.textContent='📄';const name=document.createElement('div');name.className='fname';name.textContent=f.name;const a=document.createElement('a');a.className='btn';a.textContent='다운로드';a.href=downloadUrl(f);a.target='_blank';a.rel='noopener';row.append(icon,name,a);document.getElementById('list').append(row)})}
document.getElementById('search').addEventListener('input',render);
document.getElementById('all').addEventListener('click',()=>{if(!confirm('파일 '+files.length+'개를 차례로 열까요? 브라우저가 여러 다운로드를 차단할 수 있습니다.'))return;files.forEach((f,i)=>{setTimeout(()=>{const a=document.createElement('a');a.href=downloadUrl(f);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()},i*700)})});
render();
</script></body></html>
